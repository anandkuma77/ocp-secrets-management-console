stage: plan
template: eval-generation/output-refined-templates/plan-template.md
evals:
  - id: EVAL-PL-001
    round: 1
    stage: plan
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
      - eval-generation/eval-generation-workflow/template-gaps/plan-gaps.md
    prompt: >-
      Given a repo-assessment that flags a target file as a shared component with multiple
      existing consumers (§11.0), does the generated technical_plan.md's §6 Verification
      matrix include an explicit check that exercises the component across EACH existing
      consumer's representative scenario — not only the consumer driving the new feature?
    assertions:
      - type: must_cover_phase
        value: "§6 Verification matrix"
      - type: must_reference_spec_ids
        value: "verification row references the specific existing consumers named in repo_assessment §11.0"
      - type: must_align_with_constitution
        value: "does not substitute a generic 'existing tests still pass' statement for a named per-consumer check"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "At least one verification-matrix row explicitly names and covers each existing consumer of the flagged shared component."
    pass_threshold: 80

  - id: EVAL-PL-002
    round: 1
    stage: plan
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/pattern-analysis.md
    prompt: >-
      Given a repo-assessment that flags shared-component risk, does §7 Risks, migrations,
      and operational follow-ups carry forward that risk (rather than only §6 addressing it),
      so that risk mitigation ownership is traceable end-to-end?
    assertions:
      - type: must_cover_phase
        value: "§7 Risks, migrations, and operational follow-ups"
      - type: must_mention
        value: "shared component"
      - type: must_align_with_constitution
        value: "risk entry states what can break, why, and a mitigation — not just a restatement of the assessment"
    scoring:
      method: rubric
      weight: 0.7
      pass_criteria: "§7 contains a risk entry derived from the shared-component finding with a concrete mitigation."
    pass_threshold: 75

  - id: EVAL-PL-003
    round: 2
    stage: plan
    source_issue_ids: [R2-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
      - eval-generation/eval-generation-workflow/template-gaps/plan-gaps.md
    prompt: >-
      Given a repo-assessment that documents a match-based confirmation/safety gate under
      §6 Security guardrails, does the generated technical_plan.md's §6 Verification
      matrix include an explicit Unit or Integration row covering the case where the
      expected/reference value is empty or unresolved, asserting the gate remains
      blocked?
    assertions:
      - type: must_cover_phase
        value: "§6 Verification matrix"
      - type: must_reference_spec_ids
        value: "verification row explicitly names the empty/unresolved expected-value scenario for the safety gate, not a generic 'validation tested' statement"
      - type: must_align_with_constitution
        value: "does not treat the happy-path match test as sufficient coverage for a safety-critical gate"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "A verification row explicitly covers the empty/unresolved expected-value case for the safety gate."
    pass_threshold: 85

  - id: EVAL-PL-004
    round: 3
    stage: plan
    source_issue_ids: [R3-ISSUE-001, R3-ISSUE-003]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
      - eval-generation/eval-generation-workflow/template-gaps/plan-gaps.md
    prompt: >-
      Given a repo-assessment documenting a §11.0b Migration Surface Inventory for a
      migration/upgrade/removal-type feature, does the generated technical_plan.md's §6
      Verification matrix include (a) a row confirming a repo-wide search shows zero
      remaining references to the old pattern across the touched surface, and (b), if the
      same pattern is migrated in multiple files, a row cross-checking that every instance
      converges on the same corrected shape against an already-correct reference instance?
    assertions:
      - type: must_cover_phase
        value: "§6 Verification matrix"
      - type: must_reference_spec_ids
        value: "verification row explicitly requires a repo-wide search/lint result of zero remaining old-pattern references, not a per-file 'compiles' claim"
      - type: must_align_with_constitution
        value: "when multiple instances of the same pattern are touched, the matrix cross-checks them against each other rather than verifying each file in isolation"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "Both the repo-wide completeness row and (when applicable) the cross-instance consistency row are present and specific, not generic."
    pass_threshold: 85
