stage: tasks
template: eval-generation/output-refined-templates/tasks-template.md
evals:
  - id: EVAL-TK-001
    round: 1
    stage: tasks
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
      - eval-generation/eval-generation-workflow/template-gaps/tasks-gaps.md
    prompt: >-
      Given a plan phase that modifies a shared component flagged as having multiple
      existing consumers, does the corresponding task's §4 Acceptance criteria include a
      distinct check for EACH affected existing consumer, in addition to the consumer that
      motivated the task?
    assertions:
      - type: must_cover_all_spec_requirements
        value: "acceptance criteria enumerate a check per existing consumer identified in plan/repo_assessment, not a single generic 'tests pass' bullet"
      - type: must_define_acceptance_criteria
        value: "each named consumer has an explicit, distinguishable acceptance criterion"
      - type: must_assign_agent
        value: "the task carrying this acceptance criteria is routed to the same agent responsible for the shared component's tests"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "Acceptance criteria list is not satisfied by a single umbrella test claim; each existing consumer has a traceable check."
    pass_threshold: 80

  - id: EVAL-TK-002
    round: 1
    stage: tasks
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/pattern-analysis.md
    prompt: >-
      Does the Task Execution Manifest (§3) correctly mark a shared-component task's Risk
      column as elevated (Med/High) relative to a comparably-sized task touching a
      single-consumer file, reflecting the broader blast radius?
    assertions:
      - type: must_respect_dag
        value: "shared-component task is not marked parallel-safe with sibling tasks that also touch the same shared component"
      - type: must_mention
        value: "risk"
      - type: must_define_acceptance_criteria
        value: "Risk rating is justified by the multi-consumer nature of the change, not left at default Low"
    scoring:
      method: rubric
      weight: 0.6
      pass_criteria: "Risk column reflects multi-consumer blast radius; conflicting parallel-safe tasks on the same shared component are avoided."
    pass_threshold: 70

  - id: EVAL-TK-003
    round: 2
    stage: tasks
    source_issue_ids: [R2-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
      - eval-generation/eval-generation-workflow/template-gaps/tasks-gaps.md
    prompt: >-
      Given a task implementing a match-based confirmation/safety gate (per plan.md), does
      its §4 Acceptance criteria include an explicit negative case proving the gate stays
      disabled/blocked when the expected/reference value is empty, undefined, or not yet
      loaded — in addition to the happy-path match criterion?
    assertions:
      - type: must_define_acceptance_criteria
        value: "a distinct, explicit negative-case acceptance criterion exists for the empty/unresolved expected-value scenario"
      - type: must_cover_all_spec_requirements
        value: "negative case is traceable to the spec's corresponding edge case (see spec-template's match-based confirmation edge case requirement)"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "The task's acceptance criteria are not satisfied by the happy-path match criterion alone; a distinct negative case for the empty-expected-value scenario is present."
    pass_threshold: 85

  - id: EVAL-TK-004
    round: 3
    stage: tasks
    source_issue_ids: [R3-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
      - eval-generation/eval-generation-workflow/template-gaps/tasks-gaps.md
    prompt: >-
      Given a task decomposed from a migration/upgrade/removal-type plan phase, does its
      §4 Acceptance criteria include an explicit check that the target file(s) adopt the
      framework's current, non-deprecated API for the pattern being migrated — rather than
      merely re-pointing the old-shaped import/usage at the framework's own deprecated or
      backward-compatibility entrypoint for that same shape?
    assertions:
      - type: must_define_acceptance_criteria
        value: "acceptance criteria explicitly rule out re-pointing to the framework's own deprecated/back-compat re-export as satisfying the migration"
      - type: must_cover_all_spec_requirements
        value: "criterion is traceable to the migration surface inventory / completeness definition established upstream in repo_assessment or spec"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "The task's acceptance criteria are not satisfied by a change that merely compiles against the new framework version via its own deprecated shim; the real current API must be adopted."
    pass_threshold: 85
