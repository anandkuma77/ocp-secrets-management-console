stage: code-generation
artifact: fork working copy (code + tests)
version: 3
eval_count: 14
oape_commands:
  - api-generate
  - api-generate-tests
  - api-implement
  - e2e-generate
  - manual
  - any
evals:
  - id: EVAL-CG-001
    round: 1
    stage: code-generation
    oape_command: api-implement
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      Generated code that modifies a shared, multi-consumer rendering/list component's
      conditional-display logic (e.g. pagination, empty-state, or loading-state thresholds)
      must be verified against representative item-count scenarios spanning
      below-threshold, at-threshold, and above-threshold — not only the scenario of the
      requesting feature.
    assertions:
      - type: must_mention
        value: "test or verification covering at least three item-count scenarios (below/at/above the conditional-display threshold)"
      - type: must_mention
        value: "no duplicated or omitted conditional-display elements across scenarios"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "Code/test changes demonstrate correct conditional-display behavior across the full scenario range, not just the primary feature's scenario."
    pass_threshold: 80

  - id: EVAL-CG-002
    round: 1
    stage: code-generation
    oape_command: api-generate-tests
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      Test co-generation for a change to a shared, multi-consumer component must include a
      distinct test case per existing consumer/usage pattern (not just the newly added
      consumer), verifying the shared behavior remains correct for each.
    assertions:
      - type: must_mention
        value: "distinct test case per existing consumer of the modified shared component"
      - type: must_mention
        value: "regression assertion proving no duplicated UI/output elements when combined with a pre-existing consumer's typical data volume"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "Generated tests cover every known consumer profile, including at least one low-volume and one high-volume scenario where applicable."
    pass_threshold: 80

  - id: EVAL-CG-003
    round: 1
    stage: code-generation
    oape_command: api-implement
    source_issue_ids: [R1-ISSUE-002]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      Extending an existing multi-source detection/aggregation hook (adding a new source to
      a hook that already tracks N sources with independent loading/error state and an
      aggregate derived value) must update the aggregate derived value's computation to
      include the new source.
    assertions:
      - type: must_mention
        value: "aggregate/derived loading or status value explicitly includes the newly added source in its boolean/logical expression"
      - type: must_mention
        value: "new source follows the same per-source state shape (loading, installed/error) as existing sources"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "The aggregate value's expression is updated to include the new source; omission of the new source from the aggregate fails this check."
    pass_threshold: 85

  - id: EVAL-CG-004
    round: 1
    stage: code-generation
    oape_command: api-generate-tests
    source_issue_ids: [R1-ISSUE-002]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      Tests for a newly added source in a multi-source detection/aggregation hook must
      assert that the hook's aggregate derived value changes correctly when ONLY the new
      source's state changes (isolating the new source's contribution to the aggregate).
    assertions:
      - type: must_mention
        value: "test isolates the new source's state transition and asserts the aggregate value updates accordingly"
    scoring:
      method: rubric
      weight: 0.8
      pass_criteria: "At least one test exercises the new source in isolation against the aggregate value."
    pass_threshold: 80

  - id: EVAL-CG-005
    round: 1
    stage: code-generation
    oape_command: any
    source_issue_ids: [R1-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      Adding a new resource/entity kind to a system that already lists other kinds across
      multiple independent registration points (source manifest, generated-type sync,
      detection/filtering logic, UI/filter registration) must update ALL registration
      points in the same change.
    assertions:
      - type: must_mention
        value: "diff touches every known registration point for a new resource/entity kind, not a subset"
      - type: must_mention
        value: "no registration point is left referencing only the pre-existing kinds after the change"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "All registration points for the new kind are updated consistently within the same change."
    pass_threshold: 85

  - id: EVAL-CG-006
    round: 1
    stage: code-generation
    oape_command: manual
    source_issue_ids: [R1-ISSUE-002]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      When a code-generation task implements only the minimum-bar option of a conditional
      or stretch requirement (e.g. "at minimum X; ideally also Y if feasible"), the
      implementation notes or PR description must explicitly record the scope decision
      about Y (deferred with reason, or confirmed out of scope) rather than leaving it
      unaddressed.
    assertions:
      - type: must_mention
        value: "explicit statement about the stretch/conditional item's disposition (deferred/out-of-scope/rationale)"
    scoring:
      method: rubric
      weight: 0.6
      pass_criteria: "The stretch item's disposition is explicitly recorded somewhere in the generated artifact or PR description."
    pass_threshold: 70

  - id: EVAL-CG-007
    round: 2
    stage: code-generation
    oape_command: api-implement
    source_issue_ids: [R2-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      Any match-based confirmation or safety gate for a destructive/high-risk action
      (typed-name confirmation, PIN/token match, etc.) must require the
      expected/comparison value to be explicitly non-empty/truthy in addition to matching
      the user-provided input. A bare `input === expected` comparison is insufficient
      whenever `expected` can resolve to an empty or falsy sentinel.
    assertions:
      - type: must_mention
        value: "the guard condition explicitly checks the expected/comparison value is non-empty/truthy, not just that it equals user input"
      - type: must_mention
        value: "no code path allows the gate to unlock when both the expected value and the user input are empty/falsy"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "Generated guard logic rejects the empty-expected-value bypass; a bare equality comparison without a non-empty guard fails this check."
    pass_threshold: 90

  - id: EVAL-CG-008
    round: 2
    stage: code-generation
    oape_command: api-generate-tests
    source_issue_ids: [R2-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      Tests for a match-based confirmation/safety gate must include a case where the
      expected/comparison value is empty, undefined, or not yet loaded, and assert the
      gate remains blocked even when user input is also empty — not only the happy-path
      case where both values are a real, populated string.
    assertions:
      - type: must_mention
        value: "a test case sets the expected/reference value to empty/undefined and asserts the gate/action remains disabled regardless of user input"
      - type: must_mention
        value: "happy-path match test alone is not treated as sufficient coverage"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "At least one generated test explicitly exercises the empty-expected-value case and asserts the gate stays blocked."
    pass_threshold: 85

  - id: EVAL-CG-009
    round: 2
    stage: code-generation
    oape_command: manual
    source_issue_ids: [R2-ISSUE-002]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      A pull request that introduces or modifies safety-critical confirmation/guard logic
      must not be treated as merge-ready while an Actionable/Major-severity automated
      code-review finding on that logic remains unaddressed. Every such finding must be
      resolved with a fix commit or explicitly dismissed with a stated rationale before
      merge; a bare approval comment does not satisfy this.
    assertions:
      - type: must_mention
        value: "PR description or review response explicitly addresses each Actionable/Major-severity automated-review finding on safety-critical logic (fix commit reference or documented dismissal rationale)"
      - type: must_mention
        value: "no open Actionable/Major finding on safety-critical logic is left without an explicit resolution statement"
    scoring:
      method: rubric
      weight: 0.9
      pass_criteria: "Every Actionable/Major automated-review finding touching safety-critical logic has an explicit, traceable resolution before merge is considered complete."
    pass_threshold: 85

  - id: EVAL-CG-010
    round: 2
    stage: code-generation
    oape_command: api-implement
    source_issue_ids: [R2-ISSUE-003]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      When code attaches a computed/derived property to an object before passing it
      downstream (e.g. adding a scope/category field during row-mapping), the
      corresponding state or prop type must be extended (e.g. via an intersection/extended
      interface) to declare that property, rather than relying on optional chaining to
      mask a static-type/runtime-shape mismatch.
    assertions:
      - type: must_mention
        value: "the type declaration for the value is extended/intersected to include the newly attached property"
      - type: must_mention
        value: "downstream access to the new property does not rely solely on optional chaining against a type that doesn't declare it"
    scoring:
      method: rubric
      weight: 0.6
      pass_criteria: "The static type is extended to match the actual constructed runtime shape; optional-chaining-only workarounds fail this check."
    pass_threshold: 75

  - id: EVAL-CG-011
    round: 3
    stage: code-generation
    oape_command: api-implement
    source_issue_ids: [R3-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      When migrating a component/module from a deprecated or legacy API to a current one,
      generated code must adopt the framework's current, non-deprecated API surface — not
      the framework's own backward-compatibility/deprecated re-export of the old shape,
      even if that re-export compiles cleanly against the newer major version.
    assertions:
      - type: must_mention
        value: "the migrated import/usage targets the framework's current (non-deprecated) API surface, not a `.../deprecated` (or equivalent) re-export path"
      - type: must_mention
        value: "no remaining import or usage still points at the old API's backward-compatibility shim after the change"
    scoring:
      method: rubric
      weight: 1.0
      pass_criteria: "Generated code adopts the real current API; re-pointing an old-shaped import at the framework's own deprecated entrypoint fails this check even if it compiles."
    pass_threshold: 85

  - id: EVAL-CG-012
    round: 3
    stage: code-generation
    oape_command: manual
    source_issue_ids: [R3-ISSUE-001]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      For a repo-wide migration/removal-type change, the verification step (tests or
      manual verification notes) must include a repo-wide search/lint confirming zero
      remaining references to the deprecated/legacy pattern, path, or import across the
      touched surface — not merely that each individually touched file compiles or
      renders correctly.
    assertions:
      - type: must_mention
        value: "verification includes an explicit repo-wide search/lint result showing zero remaining references to the old pattern (or an explicit, justified exception list)"
      - type: must_mention
        value: "does not substitute a per-file 'compiles/renders' claim for the repo-wide completeness check"
    scoring:
      method: rubric
      weight: 0.9
      pass_criteria: "A repo-wide completeness check (or explicit justified exception list) is present; per-file compilation alone does not satisfy this."
    pass_threshold: 80

  - id: EVAL-CG-013
    round: 3
    stage: code-generation
    oape_command: manual
    source_issue_ids: [R3-ISSUE-002]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/rca-summary.md
    prompt: >-
      A pull request must not be treated as merge-ready while ANY Actionable/Major-severity
      automated code-review finding remains unaddressed — not only findings on
      safety-critical logic (see EVAL-CG-009), but also findings about incomplete
      migrations, consistency defects, or other non-security correctness issues. Every such
      finding must be resolved with a fix commit or explicitly dismissed with a stated
      rationale before merge; a bare approval comment does not satisfy this.
    assertions:
      - type: must_mention
        value: "PR description or review response explicitly addresses each Actionable/Major-severity automated-review finding regardless of category (security, migration-completeness, consistency), with a fix commit reference or documented dismissal rationale"
      - type: must_mention
        value: "no open Actionable/Major finding of any kind is left without an explicit resolution statement before merge"
    scoring:
      method: rubric
      weight: 0.9
      pass_criteria: "Every Actionable/Major automated-review finding on the PR, of any category, has an explicit, traceable resolution before merge is considered complete."
    pass_threshold: 85

  - id: EVAL-CG-014
    round: 3
    stage: code-generation
    oape_command: api-implement
    source_issue_ids: [R3-ISSUE-003]
    input_refs:
      - eval-generation/eval-generation-workflow/outputs/epic-bug-analysis/issue-taxonomy.json
    prompt: >-
      When a change migrates or implements the same reusable UI/code pattern in more than
      one file, every instance must converge on the same corrected shape. If one instance
      of the pattern is already implemented correctly elsewhere in the same change (or
      codebase), generated code for the other instances must match it rather than
      reintroducing an inconsistent, more legacy-flavored variant.
    assertions:
      - type: must_mention
        value: "all touched instances of the shared pattern use the same corrected API shape as any already-correct reference instance in the same change"
      - type: must_mention
        value: "no instance reintroduces an older/deprecated variant of the pattern (e.g. re-wrapping a value that should be a plain prop) while a sibling instance in the same change uses the correct variant"
    scoring:
      method: rubric
      weight: 0.8
      pass_criteria: "Every touched instance of the pattern matches the corrected shape; any instance diverging from an already-correct sibling instance fails this check."
    pass_threshold: 80
