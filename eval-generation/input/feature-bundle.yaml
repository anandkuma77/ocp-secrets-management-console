  PR description (as posted): "This PR migrates all PatternFly React components from v5 to
  v6 API, updating component props and patterns to align with the latest PatternFly design
  system. ... PatternFly v5 patterns are deprecated and will be removed in future releases.
  This migration prevents breaking changes down the road."

  ### Finding 1 — DeleteConfirmationModal.tsx: migrated to the DEPRECATED v6 shim, not real v6

  Diff actually shipped (squashed commit 60d7f45):
  ```diff
   import * as React from 'react';
   import { useTranslation } from 'react-i18next';
  -import {
  -  Modal,
  -  ModalVariant,
  -  Button,
  -  Alert,
  -  AlertVariant,
  -  TextInput,
  -} from '@patternfly/react-core';
  +import { Button, Alert, AlertVariant, TextInput } from '@patternfly/react-core';
  +import { Modal, ModalVariant } from '@patternfly/react-core/deprecated';
  ```
  This "fix" makes the v5-shaped `Modal`/`ModalVariant` API keep compiling against the
  installed v6 package by pointing it at PatternFly v6's own backward-compatibility shim
  (`@patternfly/react-core/deprecated`) — it does NOT adopt the v6 composed Modal API
  (`Modal` + `ModalHeader` + `ModalBody` + `ModalFooter`, `variant="small"` as a string).

  ### CodeRabbit automated review (Run ID 24a5984b, on the first reviewed commit range,
  BEFORE the final squash/merge)

  Actionable comment (severity: 🟠 Major), on `DeleteConfirmationModal.tsx` lines 9-12:

  > **Migrate to PatternFly v6 Modal API instead of using deprecated imports.**
  > This PR aims to migrate to v6 patterns, but this file imports and uses the deprecated
  > monolithic `Modal` from `@patternfly/react-core/deprecated`. In v6, the supported Modal
  > API uses composition with `Modal`, `ModalHeader`, `ModalBody`, and `ModalFooter`... Migrate
  > fully to avoid revisiting this file when the deprecated import path is removed.
  >
  > (full composed-API diff suggestion provided, including ModalHeader/ModalBody/ModalFooter
  > and `variant="small"` as a string literal)

  Human response: `anandkuma77` (the PR author) reacted 👍 to this comment (acknowledging it),
  but the suggested fix was never implemented in any subsequent commit. `sarthakpurohit`
  commented a bare `/lgtm` and merged. **Verified against current HEAD:**
  `src/components/DeleteConfirmationModal.tsx` line 4 today still reads
  `import { Modal, ModalVariant } from '@patternfly/react-core/deprecated';` — this is also
  currently the ONLY file in the entire `src/` tree still importing from
  `@patternfly/react-core/deprecated` (confirmed via repo-wide search), meaning this ticket's
  binary acceptance criterion ("Project is moved to pattern-fly 6") is not actually fully true:
  one component was moved to a *compatibility shim for* v6, not to the v6 API itself, and no
  one has revisited it since (Apr 24, 2026 through current HEAD).

  ### Finding 2 — ResourceTable.tsx: EmptyState migration left incomplete at merge, fixed
  26 days later in a follow-up commit

  Diff shipped in 60d7f45 (still incomplete v5/v6 hybrid):
  ```diff
  -        <EmptyState>
  +        <EmptyState
  +          titleText={
  +            <Title size="lg" headingLevel="h4">
  +              {emptyStateTitle || t('No resources found')}
  +            </Title>
  +          }
  +        >
             <SearchIcon className="co-m-empty-state__icon" />
  -          <Title size="lg" headingLevel="h4">
  -            {emptyStateTitle || t('No resources found')}
  -          </Title>
             <EmptyStateBody>{emptyStateBody ?? defaultEmptyStateBody}</EmptyStateBody>
           </EmptyState>
  ```
  CodeRabbit's SECOND review (Run ID 0e5f8513, on the range 691bf65..60d7f45, i.e. reviewing
  the very commit that got squashed and merged) flagged (🟠 Major):

  > **Incomplete PatternFly v6 migration — pass `titleText` as a string, hoist `headingLevel`,
  > and move `SearchIcon` to the `icon` prop.** Two deviations from the v6 pattern used
  > elsewhere in this PR (e.g. `src/components/OperatorNotInstalled.tsx`): `titleText` is
  > being passed a nested `<Title>` element — this reintroduces the exact v5 nesting this PR
  > is migrating away from. `SearchIcon` is still rendered as a child instead of via the
  > `icon` prop. Full fix diff provided.

  This finding was posted the same day as merge (Apr 24) and was likewise never addressed
  before `sarthakpurohit` commented `/lgtm` and merged. It sat unresolved in production code
  for 26 days until commit `4fcce2b140cbada1979425d7b452cfc7730286b0` (2026-05-20,
  "fix: Use PatternFly EmptyState pattern for table empty states", authored by
  `sarthakpurohit` — the SAME person who approved the original PR — with
  `Co-authored-by: Cursor <cursoragent@cursor.com>`), which applied almost exactly the fix
  CodeRabbit had already proposed: icon via the `icon` prop, `titleText` as a plain string,
  no `Title` wrapper. This is direct, dated evidence that an ignored Major-severity finding
  is not just a theoretical risk — it became real, scheduled rework a month later, done by
  the reviewer who let it merge.

  ### Other CodeRabbit findings (Minor severity, Prettier/formatting only — not used as the
  primary eval signal, but noted for completeness): multi-line import formatting in
  DeleteConfirmationModal.tsx, missing aria-label on an icon-only back button in
  ResourceInspect.tsx, inline style object formatting in SecretsManagement.tsx.

bugs:
  - key: "N/A (flagged by CodeRabbit pre-merge as 'Actionable/Major', acknowledged with a 👍 reaction, never fixed — still live in HEAD)"
    summary: >
      SMC-9's acceptance criterion ("Project is moved to pattern-fly 6") is not fully met:
      `src/components/DeleteConfirmationModal.tsx` still imports `Modal`/`ModalVariant` from
      `@patternfly/react-core/deprecated` — PatternFly v6's own backward-compatibility shim
      for the pre-v6 monolithic Modal API — rather than the real v6 composed Modal API
      (`Modal`/`ModalHeader`/`ModalBody`/`ModalFooter`). It is the only file in `src/` still
      on this deprecated import path, and remains so as of current HEAD.
    root_cause: >
      The "migration" ticket's acceptance criterion was a single unverifiable sentence
      ("Project is moved to pattern-fly 6") with no per-component checklist and no automated
      completion gate (e.g., a lint rule or grep check banning
      `@patternfly/react-core/deprecated` imports repo-wide). The implementer took the path of
      least resistance for one file — re-pointing the deprecated-shaped import at PatternFly
      v6's own deprecated re-export, which compiles cleanly and looks superficially "migrated"
      — rather than adopting the composed v6 API. CodeRabbit caught this exact gap with a
      Major-severity finding and a complete proposed fix; the author acknowledged it (👍) but
      never pushed a fix commit, and the human reviewer merged on a bare `/lgtm` without
      checking whether the actionable comment had been resolved.
    fix_pr: "None — unresolved. CodeRabbit's suggested composed-Modal-API fix was never applied."
    affected_stage: "code-generation"
