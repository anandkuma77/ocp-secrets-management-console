# Feature Bundle Input — Provide all links and content for one eval-loop round
#
# Round 3 — ocp-secrets-management-console
# SMC-9: Migrate PatternFly components from v5 to v6.
# Headline finding: the ticket's acceptance criterion ("Project is moved to pattern-fly 6")
# has no verifiable completion definition. The PR that closed it left exactly one component
# (DeleteConfirmationModal.tsx) on the deprecated v5-compatible `@patternfly/react-core/deprecated`
# Modal import instead of the real v6 composed Modal API. CodeRabbit correctly flagged this as
# "Major" severity with a concrete fix, the author reacted 👍 (acknowledging it) but never
# implemented the fix, and it merged anyway with a bare "/lgtm" — the exact
# unresolved-automated-review-finding pattern from round 2 (SMC-8), now observed a second time
# with a different author/reviewer pairing on a different kind of defect (incomplete migration,
# not a security bypass). Verified still present in current HEAD.
#
# A SECOND Major finding in the same PR (ResourceTable.tsx EmptyState using a nested <Title>
# instead of a plain titleText string, icon rendered as a child instead of via the icon prop)
# was also left unresolved at merge, and had to be fixed 26 days later in an unrelated-looking
# follow-up commit (4fcce2b, by the same reviewer who approved the original PR) — direct proof
# that ignoring automated review findings at merge time creates real downstream rework, not just
# theoretical risk.

